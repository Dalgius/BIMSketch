<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Stratigrafie</title>
<link rel="stylesheet" href="common.css">
<script src="common.js"></script>
<style>
  .layout { display: flex; gap: 12px; align-items: flex-start; }
  .list { flex: 0 0 230px; }
  .list .item { padding: 6px 8px; border-radius: 4px; cursor: pointer; }
  .list .item:hover { background: var(--row); }
  .list .item.sel { background: var(--accent); color: var(--accent-text); }
  .list .item small { display: block; opacity: .75; }
  .editor { flex: 1; min-width: 0; }
  .layers input, .layers select { width: 100%; }
  .layers select { min-width: 100px; }
  .layers td { padding: 3px 4px; }
  .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: middle; }
  .result { display: flex; gap: 18px; margin-top: 8px; font-weight: 600; }
  .tabs { display: flex; gap: 4px; margin-bottom: 10px; }
  .tabs button.sel { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  @media (max-width: 640px) { .layout { flex-direction: column; } .list { flex: none; width: 100%; } }
</style>
</head>
<body>
<h1 id="title">Stratigrafie</h1>
<div class="tabs"><button data-kind="wall">Muri</button><button data-kind="slab">Solai e coperture</button></div>
<div id="error" class="notice error-text" style="display:none"></div>
<div class="layout">
  <div class="list panel">
    <div id="types"></div>
    <div class="toolbar">
      <button class="small" id="newType">+ Nuova</button>
      <button class="small" id="dupType">Duplica</button>
      <button class="small" id="delType">Elimina</button>
    </div>
  </div>
  <div class="editor panel" id="editor"></div>
</div>
<div class="toolbar">
  <button class="primary" id="save">Salva libreria</button>
  <button id="assign">Assegna ai muri selezionati</button>
  <label class="muted" id="flippedBox"><input type="checkbox" id="flipped"> strati invertiti</label>
  <span class="muted" id="selInfo"></span>
</div>
<p class="muted" id="note"></p>

<script>
(function () {
  var state = { kind: 'wall', types: [], usage: {}, functions: {}, rsi: 0.13, rse: 0.04 };
  var NOTES = {
    wall: 'Gli strati sono elencati dalla faccia destra del muro (rispetto alla direzione di disegno) ' +
      'alla faccia sinistra; "strati invertiti" li percorre al contrario. Salvando, i muri che usano una tipologia ' +
      'modificata vengono ricostruiti con il nuovo spessore e i giunti ricalcolati. La trasmittanza U è calcolata ' +
      'secondo UNI EN ISO 6946 (Rsi 0,13 e Rse 0,04 m²K/W, flusso orizzontale) quando tutti gli strati hanno la conduttività λ.',
    slab: 'Gli strati sono elencati dall\'estradosso (pavimento o manto) all\'intradosso. Assegnando una tipologia ' +
      'la faccia superiore del solaio resta alla sua quota e lo spessore cresce verso il basso. La trasmittanza U ' +
      'è calcolata secondo UNI EN ISO 6946 con flusso verso il basso (Rsi 0,17, Rse 0,04 m²K/W) per i solai ' +
      'e verso l\'alto (Rsi 0,10) per le coperture; i solai controterra richiedono la UNI EN ISO 13370.'
  };
  var WORDS = { wall: ['muro', 'muri'], slab: ['solaio', 'solai'] };
  var current = 0;
  var snapshot = '[]';
  var COLORS = { structure: '#be6e50', insulation: '#f4d66e', finish: '#ece8de', other: '#aaaaaa' };

  function num(v) {
    if (v === null || v === undefined || v === '') return null;
    var n = parseFloat(String(v).replace(',', '.'));
    return isNaN(n) ? null : n;
  }

  function thickness(t) { return t.layers.reduce(function (s, l) { return s + (num(l.thickness) || 0); }, 0); }

  function uValue(t) {
    if (!t.layers.length) return null;
    var r = state.rsi + state.rse;
    for (var i = 0; i < t.layers.length; i++) {
      var lam = num(t.layers[i].lambda), d = num(t.layers[i].thickness);
      if (!lam || lam <= 0 || d === null) return null;
      r += d / lam;
    }
    return 1 / r;
  }

  function nextId() {
    var ids = state.types.map(function (t) { return t.id; }), i = 1;
    var prefix = state.kind === 'slab' ? 'ST' : 'WT';
    while (ids.indexOf(prefix + i) >= 0) i++;
    return prefix + i;
  }

  function drawList() {
    var html = '';
    state.types.forEach(function (t, i) {
      var used = state.usage[t.id] || 0;
      html += '<div class="item' + (i === current ? ' sel' : '') + '" data-i="' + i + '">' + BIM.esc(t.name) +
        '<small>' + BIM.num(thickness(t) * 100, 1) + ' cm' + (used ? ' · ' + used + ' ' + WORDS[state.kind][1] : '') + '</small></div>';
    });
    BIM.$('types').innerHTML = html || '<span class="muted">Nessuna tipologia.</span>';
  }

  function fnOptions(sel) {
    return Object.keys(state.functions).map(function (k) {
      return '<option value="' + k + '"' + (k === sel ? ' selected' : '') + '>' + BIM.esc(state.functions[k]) + '</option>';
    }).join('');
  }

  function drawEditor() {
    var t = state.types[current];
    if (!t) { BIM.$('editor').innerHTML = '<span class="muted">Crea una tipologia.</span>'; return; }
    var html = '<div class="row"><label>Nome</label><input id="tName" value="' + BIM.esc(t.name) + '"></div>' +
      '<table class="layers"><thead><tr><th></th><th>Strato</th><th>Materiale</th><th class="num">Spessore (cm)</th>' +
      '<th class="num">λ (W/mK)</th><th>Funzione</th><th></th></tr></thead><tbody>';
    t.layers.forEach(function (l, i) {
      html += '<tr data-i="' + i + '"><td><span class="swatch" style="background:' + (COLORS[l.function] || COLORS.other) + '"></span></td>' +
        '<td><input data-k="name" value="' + BIM.esc(l.name) + '"></td>' +
        '<td><input data-k="material" value="' + BIM.esc(l.material) + '"></td>' +
        '<td><input data-k="thickness" class="num" value="' + BIM.num((num(l.thickness) || 0) * 100, 2) + '"></td>' +
        '<td><input data-k="lambda" class="num" value="' + (l.lambda === null || l.lambda === undefined ? '' : BIM.num(l.lambda, 3)) + '"></td>' +
        '<td><select data-k="function">' + fnOptions(l.function) + '</select></td>' +
        '<td style="white-space:nowrap"><button class="small" data-act="up">↑</button><button class="small" data-act="down">↓</button>' +
        '<button class="small" data-act="del">×</button></td></tr>';
    });
    html += '</tbody></table><div class="toolbar"><button class="small" id="addLayer">+ Aggiungi strato</button></div>';
    html += '<div class="result" id="result"></div>';
    BIM.$('editor').innerHTML = html;
    drawResult();
  }

  function drawResult() {
    var t = state.types[current];
    if (!t) return;
    var u = uValue(t);
    BIM.$('result').innerHTML = '<span>Spessore totale: ' + BIM.num(thickness(t) * 100, 1) + ' cm</span>' +
      '<span>U = ' + (u === null ? '— (manca λ)' : BIM.num(u, 3) + ' W/m²K') + '</span>';
  }

  function readEditor() {
    var t = state.types[current];
    if (!t) return;
    var name = BIM.$('tName');
    if (name) t.name = name.value;
    var rows = document.querySelectorAll('.layers tbody tr');
    for (var i = 0; i < rows.length; i++) {
      var l = t.layers[Number(rows[i].getAttribute('data-i'))];
      rows[i].querySelectorAll('[data-k]').forEach(function (f) {
        var k = f.getAttribute('data-k');
        if (k === 'thickness') { var cm = num(f.value); l.thickness = cm === null ? 0 : cm / 100; }
        else if (k === 'lambda') l.lambda = num(f.value);
        else l[k] = f.value;
      });
    }
  }

  BIM.render = function (d) {
    var id = state.kind === d.kind && state.types[current] && state.types[current].id;
    state = d;
    snapshot = JSON.stringify(d.types);
    var idx = state.types.map(function (t) { return t.id; }).indexOf(id);
    current = idx >= 0 ? idx : 0;
    var w = WORDS[d.kind] || WORDS.wall;
    BIM.$('selInfo').textContent = d.selected ? d.selected + ' ' + w[1] + ' selezionati' : 'nessun ' + w[0] + ' selezionato';
    BIM.$('assign').textContent = 'Assegna ai ' + w[1] + ' selezionati';
    BIM.$('flippedBox').style.display = d.kind === 'slab' ? 'none' : '';
    BIM.$('note').textContent = NOTES[d.kind] || NOTES.wall;
    BIM.$('title').textContent = d.kind === 'slab' ? 'Stratigrafie dei solai' : 'Stratigrafie dei muri';
    document.querySelectorAll('.tabs button').forEach(function (b) {
      b.className = b.getAttribute('data-kind') === d.kind ? 'sel' : '';
    });
    drawList();
    drawEditor();
  };

  BIM.saved = function () {
    snapshot = JSON.stringify(state.types);
    var b = BIM.$('save');
    b.textContent = 'Salvata ✓';
    setTimeout(function () { b.textContent = 'Salva libreria'; }, 1200);
  };

  BIM.$('types').addEventListener('click', function (ev) {
    var it = ev.target.closest('.item');
    if (!it) return;
    readEditor();
    current = Number(it.getAttribute('data-i'));
    drawList();
    drawEditor();
  });
  BIM.$('editor').addEventListener('input', function () { readEditor(); drawResult(); drawList(); });
  BIM.$('editor').addEventListener('change', function (ev) {
    if (ev.target.getAttribute('data-k') === 'function') { readEditor(); drawEditor(); }
  });
  BIM.$('editor').addEventListener('click', function (ev) {
    var t = state.types[current];
    if (ev.target.id === 'addLayer') {
      readEditor();
      t.layers.push({ name: '', material: '', thickness: 0.05, lambda: null, function: 'other' });
      drawEditor();
      return;
    }
    var act = ev.target.getAttribute('data-act');
    if (!act) return;
    readEditor();
    var i = Number(ev.target.closest('tr').getAttribute('data-i'));
    if (act === 'del') t.layers.splice(i, 1);
    if (act === 'up' && i > 0) t.layers.splice(i - 1, 0, t.layers.splice(i, 1)[0]);
    if (act === 'down' && i < t.layers.length - 1) t.layers.splice(i + 1, 0, t.layers.splice(i, 1)[0]);
    drawEditor();
    drawList();
  });
  BIM.$('newType').addEventListener('click', function () {
    readEditor();
    state.types.push({ id: nextId(), name: 'Nuova tipologia',
      layers: state.kind === 'slab'
        ? [{ name: 'Soletta', material: 'Calcestruzzo armato', thickness: 0.20, lambda: 2.3, function: 'structure' }]
        : [{ name: 'Muratura', material: 'Laterizio', thickness: 0.25, lambda: 0.4, function: 'structure' }] });
    current = state.types.length - 1;
    drawList();
    drawEditor();
  });
  BIM.$('dupType').addEventListener('click', function () {
    readEditor();
    var t = state.types[current];
    if (!t) return;
    var copy = JSON.parse(JSON.stringify(t));
    copy.id = nextId();
    copy.name = t.name + ' (copia)';
    state.types.push(copy);
    current = state.types.length - 1;
    drawList();
    drawEditor();
  });
  BIM.$('delType').addEventListener('click', function () {
    var t = state.types[current];
    if (!t) return;
    var used = state.usage[t.id] || 0;
    if (!confirm('Eliminare la tipologia "' + t.name + '"?' + (used ? '\n' + used + ' ' + WORDS[state.kind][1] + ' torneranno a un unico strato.' : ''))) return;
    state.types.splice(current, 1);
    current = 0;
    drawList();
    drawEditor();
  });
  document.querySelector('.tabs').addEventListener('click', function (ev) {
    var k = ev.target.getAttribute('data-kind');
    if (!k || k === state.kind) return;
    readEditor();
    if (JSON.stringify(state.types) !== snapshot &&
        !confirm('Le modifiche non salvate a questa libreria andranno perse. Continuare?')) return;
    BIM.call('kind', { kind: k });
  });
  BIM.$('save').addEventListener('click', function () {
    readEditor();
    BIM.call('save', { types: state.types });
  });
  BIM.$('assign').addEventListener('click', function () {
    readEditor();
    var t = state.types[current];
    if (!t) return;
    BIM.call('save', { types: state.types });
    BIM.call('assign', { id: t.id, flipped: BIM.$('flipped').checked });
  });
})();
</script>
</body>
</html>
